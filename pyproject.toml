[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xpd-report-agent"
version = "0.1.0"
description = "Hermes Agent powered MySQL live-commerce report query service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.3.2",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
    "pymysql>=1.1.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "reportlab>=4.4.0",
    "sqlglot>=25.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
xpd-report-agent = "xpd_report_agent.runtime.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
hermes-plugin = [
    "alibabacloud-oss-v2>=1.3.2",
    "openpyxl>=3.1.5",
    "pymysql>=1.1.0",
    "pypdf>=6.0.0",
    "pyyaml>=6.0.0",
    "reportlab>=4.4.0",
    "sqlglot>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xpd_report_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
