name: db-query
version: 0.1.0
description: MySQL report database query tools for Hermes Agent multi-table SQL verification.
kind: standalone
pip_dependencies:
  - sqlglot>=25.0.0
  - pyyaml>=6.0.0
  - pymysql>=1.1.0
  - reportlab>=4.4.0
  - pypdf>=6.0.0
  - alibabacloud-oss-v2>=1.3.2
  - openpyxl>=3.1.5
provides_tools:
  - db_get_schema_ddl
  - db_schema_search
  - db_get_table_profile
  - db_get_join_paths
  - db_validate_sql
  - db_execute_sql
  - export_report_file
requires_env:
  - MYSQL_HOST
  - MYSQL_PORT
  - MYSQL_USER
  - MYSQL_PASSWORD
  - MYSQL_DATABASE
  - XPD_FILE_STORAGE_PATH
