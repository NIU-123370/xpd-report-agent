apiVersion: v1
kind: ServiceAccount
metadata:
  name: xpd-report-agent
  namespace: xpd-report-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xpd-report-agent-endpointslice-reader
  namespace: xpd-report-agent
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xpd-report-agent-endpointslice-reader
  namespace: xpd-report-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xpd-report-agent-endpointslice-reader
subjects:
  - kind: ServiceAccount
    name: xpd-report-agent
    namespace: xpd-report-agent
